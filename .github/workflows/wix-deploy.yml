name: Deploy web/ to Wix Headless

on:
  push:
    branches: [main, claude/migrate-site-to-wix-ghfd1a]
    paths:
      - 'web/**'
      - '.github/workflows/wix-deploy.yml'
  workflow_dispatch:
    inputs:
      comment:
        description: 'Release comment (shown in Wix release history)'
        required: false
        default: 'Manual deploy from GitHub Actions'

concurrency:
  group: wix-deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: wix release
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify WIX_API_KEY is set
        env:
          WIX_API_KEY: ${{ secrets.WIX_API_KEY }}
        run: |
          if [ -z "$WIX_API_KEY" ]; then
            echo "::error::WIX_API_KEY secret is not set."
            echo "One-time setup:"
            echo "  1) Create a Wix API key at https://manage.wix.com/account/api-keys"
            echo "     (Wix account → Settings → API Keys → Generate API Key)."
            echo "  2) In this repo: Settings → Secrets and variables → Actions → New"
            echo "     repository secret named WIX_API_KEY, paste the key value."
            echo "  3) Re-run this workflow (Actions tab → this run → Re-run all jobs)."
            exit 1
          fi
          echo "WIX_API_KEY is set (length: ${#WIX_API_KEY})."

      - name: Log in to Wix
        working-directory: web
        env:
          WIX_API_KEY: ${{ secrets.WIX_API_KEY }}
        run: npx -y @wix/cli login --api-key "$WIX_API_KEY"

      - name: Show identity
        working-directory: web
        run: npx -y @wix/cli whoami

      - name: Stage static site into dist (build output)
        working-directory: web
        run: |
          rm -rf dist
          mkdir -p dist
          find . -mindepth 1 -maxdepth 1 \
            ! -name dist ! -name wix.config.json ! -name README.md \
            -exec cp -r {} dist/ \;
          echo "dist contents:"
          find dist -type f | sort

      - name: Release
        working-directory: web
        env:
          COMMENT: ${{ github.event.inputs.comment || format('Auto-deploy from {0}@{1}', github.ref_name, github.sha) }}
        run: npx -y @wix/cli release --comment "$COMMENT"

      - name: Summary
        if: always()
        run: |
          echo "### Deploy summary" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- Ref: \`${{ github.ref_name }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Commit: \`${{ github.sha }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Live site: https://t-c-inline-9f66df29-zitnitskicpa.wix-site-host.com/" >> "$GITHUB_STEP_SUMMARY"
