<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>המתכונים של תמר 🍰</title>
    <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;700&family=Rubik+Bubbles&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Heebo', sans-serif;
            background: linear-gradient(135deg, #fce4ec 0%, #e8eaf6 25%, #fff3e0 50%, #f3e5f5 75%, #e0f7fa 100%);
            background-attachment: fixed;
            min-height: 100vh;
            color: #4a3728;
            overflow-x: hidden;
        }

        /* Floating decorative elements */
        .decoration {
            position: fixed;
            pointer-events: none;
            z-index: 0;
            opacity: 0.15;
            font-size: 3rem;
            animation: float 6s ease-in-out infinite;
        }
        .decoration:nth-child(1) { top: 5%; left: 5%; animation-delay: 0s; }
        .decoration:nth-child(2) { top: 15%; right: 8%; animation-delay: 1s; font-size: 2.5rem; }
        .decoration:nth-child(3) { top: 40%; left: 3%; animation-delay: 2s; }
        .decoration:nth-child(4) { top: 60%; right: 5%; animation-delay: 3s; font-size: 2rem; }
        .decoration:nth-child(5) { top: 80%; left: 8%; animation-delay: 4s; }
        .decoration:nth-child(6) { top: 25%; left: 50%; animation-delay: 1.5s; font-size: 2rem; }
        .decoration:nth-child(7) { top: 70%; right: 20%; animation-delay: 2.5s; font-size: 2.5rem; }
        .decoration:nth-child(8) { top: 90%; left: 30%; animation-delay: 3.5s; }

        @keyframes float {
            0%, 100% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-20px) rotate(5deg); }
        }

        /* Header */
        .header {
            text-align: center;
            padding: 3rem 1rem 2rem;
            position: relative;
            z-index: 1;
        }

        .header h1 {
            font-family: 'Rubik Bubbles', cursive;
            font-size: 3.5rem;
            color: #e91e63;
            text-shadow: 2px 2px 4px rgba(233, 30, 99, 0.2);
            margin-bottom: 0.5rem;
            animation: titleGlow 3s ease-in-out infinite;
        }

        @keyframes titleGlow {
            0%, 100% { text-shadow: 2px 2px 4px rgba(233, 30, 99, 0.2); }
            50% { text-shadow: 2px 2px 8px rgba(233, 30, 99, 0.4), 0 0 20px rgba(233, 30, 99, 0.1); }
        }

        .header .subtitle {
            font-size: 1.2rem;
            color: #8d6e63;
            font-weight: 300;
        }

        .header .baker-icon {
            font-size: 4rem;
            margin-bottom: 1rem;
            display: block;
        }

        /* Search and Filter */
        .controls {
            max-width: 800px;
            margin: 0 auto 2rem;
            padding: 0 1rem;
            position: relative;
            z-index: 1;
        }

        .search-box {
            width: 100%;
            padding: 1rem 1.5rem;
            border: 2px solid #f8bbd0;
            border-radius: 50px;
            font-size: 1.1rem;
            font-family: 'Heebo', sans-serif;
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(10px);
            outline: none;
            transition: all 0.3s ease;
            text-align: right;
        }

        .search-box:focus {
            border-color: #e91e63;
            box-shadow: 0 0 20px rgba(233, 30, 99, 0.15);
        }

        .search-box::placeholder {
            color: #ce93d8;
        }

        .categories {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
            justify-content: center;
            margin-top: 1rem;
        }

        .category-btn {
            padding: 0.5rem 1.2rem;
            border: 2px solid #f8bbd0;
            border-radius: 25px;
            background: rgba(255, 255, 255, 0.7);
            color: #ad1457;
            font-family: 'Heebo', sans-serif;
            font-size: 0.95rem;
            cursor: pointer;
            transition: all 0.3s ease;
            backdrop-filter: blur(5px);
        }

        .category-btn:hover, .category-btn.active {
            background: linear-gradient(135deg, #f48fb1, #ce93d8);
            color: white;
            border-color: transparent;
            transform: scale(1.05);
            box-shadow: 0 4px 15px rgba(233, 30, 99, 0.3);
        }

        /* Recipe Grid */
        .recipes-grid {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 1rem 3rem;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
            gap: 2rem;
            position: relative;
            z-index: 1;
        }

        /* Recipe Card */
        .recipe-card {
            background: rgba(255, 255, 255, 0.88);
            backdrop-filter: blur(15px);
            border-radius: 24px;
            overflow: hidden;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.08);
            transition: all 0.4s ease;
            cursor: pointer;
            border: 1px solid rgba(248, 187, 208, 0.3);
        }

        .recipe-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 16px 48px rgba(233, 30, 99, 0.15);
        }

        .recipe-card-header {
            padding: 1.5rem 1.5rem 1rem;
            position: relative;
        }

        .recipe-emoji {
            font-size: 3.5rem;
            text-align: center;
            margin-bottom: 0.5rem;
            display: block;
        }

        .recipe-card-header h2 {
            font-size: 1.5rem;
            color: #ad1457;
            text-align: center;
            font-weight: 700;
        }

        .recipe-type {
            display: inline-block;
            padding: 0.25rem 0.8rem;
            border-radius: 15px;
            font-size: 0.8rem;
            font-weight: 500;
            margin-top: 0.5rem;
            text-align: center;
            width: 100%;
        }

        .type-אפייה { background: #fce4ec; color: #c2185b; }
        .type-בישול { background: #fff3e0; color: #e65100; }
        .type-סלטים { background: #e8f5e9; color: #2e7d32; }
        .type-קינוחים { background: #f3e5f5; color: #7b1fa2; }
        .type-שתייה { background: #e3f2fd; color: #1565c0; }

        .recipe-card-body {
            padding: 0 1.5rem 1.5rem;
        }

        .recipe-section {
            margin-bottom: 1rem;
        }

        .recipe-section-title {
            font-weight: 700;
            color: #e91e63;
            font-size: 0.95rem;
            margin-bottom: 0.4rem;
            display: flex;
            align-items: center;
            gap: 0.4rem;
        }

        .recipe-section ul {
            list-style: none;
            padding: 0;
        }

        .recipe-section ul li {
            padding: 0.2rem 0;
            font-size: 0.9rem;
            color: #5d4037;
            display: flex;
            align-items: center;
            gap: 0.3rem;
        }

        .recipe-section ul li::before {
            content: '•';
            color: #f48fb1;
            font-weight: bold;
        }

        .recipe-steps {
            font-size: 0.9rem;
            color: #5d4037;
            line-height: 1.7;
        }

        .recipe-note {
            background: linear-gradient(135deg, #fff9c4, #ffe0b2);
            padding: 0.8rem 1rem;
            border-radius: 12px;
            font-size: 0.85rem;
            color: #795548;
            margin-top: 0.5rem;
        }

        .recipe-note::before {
            content: '💡 ';
        }

        /* Expand/Collapse */
        .recipe-card-body .recipe-steps,
        .recipe-card-body .recipe-note {
            display: none;
        }

        .recipe-card.expanded .recipe-steps,
        .recipe-card.expanded .recipe-note {
            display: block;
        }

        .recipe-card.expanded .recipe-section.ingredients-section ul li:nth-child(n+5) {
            display: list-item;
        }

        .expand-hint {
            text-align: center;
            font-size: 0.8rem;
            color: #ce93d8;
            padding: 0.5rem;
            transition: opacity 0.3s;
        }

        .recipe-card.expanded .expand-hint {
            opacity: 0;
        }

        /* Footer */
        .footer {
            text-align: center;
            padding: 2rem;
            color: #b39ddb;
            font-size: 0.9rem;
            position: relative;
            z-index: 1;
        }

        .footer .heart {
            color: #e91e63;
            animation: heartbeat 1.5s ease-in-out infinite;
            display: inline-block;
        }

        @keyframes heartbeat {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.2); }
        }

        /* Modal for full recipe */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.5);
            z-index: 100;
            justify-content: center;
            align-items: center;
            padding: 1rem;
            backdrop-filter: blur(5px);
        }

        .modal-overlay.active {
            display: flex;
        }

        .modal {
            background: linear-gradient(135deg, #fff, #fce4ec);
            border-radius: 24px;
            max-width: 600px;
            width: 100%;
            max-height: 85vh;
            overflow-y: auto;
            padding: 2rem;
            position: relative;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.2);
        }

        .modal-close {
            position: absolute;
            top: 1rem;
            left: 1rem;
            background: #f8bbd0;
            border: none;
            border-radius: 50%;
            width: 36px;
            height: 36px;
            font-size: 1.2rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s;
        }

        .modal-close:hover {
            background: #e91e63;
            color: white;
        }

        .modal .recipe-emoji {
            font-size: 4.5rem;
        }

        .modal h2 {
            text-align: center;
            color: #ad1457;
            font-size: 1.8rem;
            margin-bottom: 0.5rem;
        }

        .modal .recipe-type {
            display: block;
            width: fit-content;
            margin: 0.5rem auto 1.5rem;
        }

        .modal .recipe-section {
            margin-bottom: 1.5rem;
        }

        .modal .recipe-section-title {
            font-size: 1.1rem;
            margin-bottom: 0.6rem;
        }

        .modal .recipe-section ul li {
            font-size: 1rem;
            padding: 0.3rem 0;
        }

        .modal .recipe-steps {
            font-size: 1rem;
            line-height: 1.8;
        }

        .modal .recipe-note {
            font-size: 0.95rem;
            padding: 1rem 1.2rem;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .header h1 {
                font-size: 2.5rem;
            }

            .recipes-grid {
                grid-template-columns: 1fr;
            }

            .modal {
                padding: 1.5rem;
                margin: 0.5rem;
            }
        }

        /* Print styles */
        @media print {
            .decoration, .controls, .expand-hint { display: none !important; }
            .recipe-card { break-inside: avoid; box-shadow: none; border: 1px solid #ddd; }
            body { background: white; }
        }
    </style>
</head>

// Render recipes
function renderRecipes(filteredRecipes) {
    const grid = document.getElementById('recipesGrid');
    grid.innerHTML = '';

    filteredRecipes.forEach(recipe => {
        const card = document.createElement('div');
        card.className = 'recipe-card';
        card.setAttribute('data-category', recipe.category);
        card.onclick = () => openModal(recipe);

        // Show first 4 ingredients
        const topIngredients = recipe.ingredients.slice(0, 4);

        card.innerHTML = `
            <div class="recipe-card-header">
                <span class="recipe-emoji">${recipe.emoji}</span>
                <h2>${recipe.name}</h2>
                <span class="recipe-type type-${recipe.category}">${recipe.category}</span>
            </div>
            <div class="recipe-card-body">
                <div class="recipe-section">
                    <div class="recipe-section-title">🛒 מצרכים</div>
                    <ul>
                        ${topIngredients.map(i => `<li>${i}</li>`).join('')}
                        ${recipe.ingredients.length > 4 ? `<li style="color:#ce93d8; font-size:0.8rem;">ועוד ${recipe.ingredients.length - 4} מצרכים...</li>` : ''}
                    </ul>
                </div>
                <div class="expand-hint">👆 לחצו לצפייה במתכון המלא</div>
            </div>
        `;

        grid.appendChild(card);
    });
}

// Search
document.getElementById('searchBox').addEventListener('input', function(e) {
    const query = e.target.value.trim();
    const activeCategory = document.querySelector('.category-btn.active').dataset.category;

    let filtered = recipes;

    if (activeCategory !== 'הכל') {
        filtered = filtered.filter(r => r.category === activeCategory);
    }

    if (query) {
        filtered = filtered.filter(r =>
            r.name.includes(query) ||
            r.ingredients.some(i => i.includes(query)) ||
            r.category.includes(query) ||
            r.steps.includes(query)
        );
    }

    renderRecipes(filtered);
});

// Category filter
document.querySelectorAll('.category-btn').forEach(btn => {
    btn.addEventListener('click', function() {
        document.querySelectorAll('.category-btn').forEach(b => b.classList.remove('active'));
        this.classList.add('active');

        const category = this.dataset.category;
        const query = document.getElementById('searchBox').value.trim();

        let filtered = recipes;

        if (category !== 'הכל') {
            filtered = filtered.filter(r => r.category === category);
        }

        if (query) {
            filtered = filtered.filter(r =>
                r.name.includes(query) ||
                r.ingredients.some(i => i.includes(query)) ||
                r.steps.includes(query)
            );
        }

        renderRecipes(filtered);
    });
});

// Modal
function openModal(recipe) {
    const modal = document.getElementById('modalOverlay');
    const body = document.getElementById('modalBody');

    body.innerHTML = `
        <span class="recipe-emoji">${recipe.emoji}</span>
        <h2>${recipe.name}</h2>
        <span class="recipe-type type-${recipe.category}">${recipe.category}</span>

        <div class="recipe-section">
            <div class="recipe-section-title">🛒 מצרכים</div>
            <ul>
                ${recipe.ingredients.map(i => `<li>${i}</li>`).join('')}
            </ul>
        </div>

        <div class="recipe-section">
            <div class="recipe-section-title">👩‍🍳 אופן ההכנה</div>
            <div class="recipe-steps">${recipe.steps}</div>
        </div>

        <div class="recipe-section">
            <div class="recipe-section-title">💡 הערות וטיפים</div>
            <div class="recipe-note">${recipe.note}</div>
        </div>
    `;

    modal.classList.add('active');
    document.body.style.overflow = 'hidden';
}

function closeModal() {
    document.getElementById('modalOverlay').classList.remove('active');
    document.body.style.overflow = '';
}

document.getElementById('modalOverlay').addEventListener('click', function(e) {
    if (e.target === this) closeModal();
});

document.addEventListener('keydown', function(e) {
    if (e.key === 'Escape') closeModal();
});

// Initial render
renderRecipes(recipes);
</script>
