<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>המתכונים של תמר 🍳</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700;800&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #faf5f0 0%, #f5eff8 50%, #eff5fa 100%);
            background-attachment: fixed;
            color: #4a3f3a;
            line-height: 1.8;
            overflow-x: hidden;
        }

        /* ============ HEADER ============ */
        header {
            background: linear-gradient(135deg, #f4a8c0 0%, #d8a8e8 35%, #a8d4f0 70%, #a8e0d0 100%);
            color: white;
            padding: 4rem 2rem 3rem;
            position: relative;
            overflow: hidden;
            box-shadow: 0 20px 60px rgba(244, 168, 192, 0.25);
        }

        header::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400"><defs><filter id="noise"><feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="4" result="noise"/><feDisplacementMap in="SourceGraphic" in2="noise" scale="20"/></filter></defs><circle cx="150" cy="100" r="80" fill="rgba(255,255,255,0.05)"/><circle cx="1050" cy="300" r="120" fill="rgba(255,255,255,0.08)"/></svg>');
            opacity: 0.3;
            animation: drift 20s ease-in-out infinite;
        }

        @keyframes drift {
            0%, 100% { transform: translate(0, 0); }
            50% { transform: translate(30px, -20px); }
        }

        .header-content {
            position: relative;
            z-index: 2;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1.5rem;
        }

        .header-avatar {
            width: 100px;
            height: 100px;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3.5rem;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.15);
            animation: float 3s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-8px); }
        }

        header h1 {
            font-family: 'Playfair Display', serif;
            font-size: 3.2rem;
            font-weight: 800;
            text-shadow: 0 4px 12px rgba(0, 0, 0, 0.15);
            letter-spacing: -1px;
            margin: 0;
        }

        header p {
            font-size: 1.2rem;
            font-weight: 300;
            opacity: 0.95;
            max-width: 500px;
            letter-spacing: 0.5px;
        }

        /* ============ SEARCH & FILTER ============ */
        .controls-wrapper {
            position: sticky;
            top: 0;
            z-index: 100;
            background: linear-gradient(180deg, rgba(250, 245, 240, 0.98) 0%, rgba(250, 245, 240, 0.95) 100%);
            backdrop-filter: blur(10px);
            padding: 1.5rem 0;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.06);
        }

        .controls-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 1.5rem;
        }

        .search-container {
            margin-bottom: 1.5rem;
        }

        .search-box {
            width: 100%;
            max-width: 500px;
            display: block;
            margin: 0 auto;
            padding: 1rem 1.5rem;
            border: 2px solid #e8d5c4;
            border-radius: 50px;
            font-family: 'Poppins', sans-serif;
            font-size: 1rem;
            background: white;
            color: #4a3f3a;
            outline: none;
            transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.04);
        }

        .search-box:focus {
            border-color: #f4a8c0;
            box-shadow: 0 8px 25px rgba(244, 168, 192, 0.2);
            transform: translateY(-2px);
        }

        .search-box::placeholder {
            color: #b8a89a;
        }

        /* Filter bar */
        .filter-bar {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 0.7rem;
        }

        .filter-btn {
            padding: 0.65rem 1.5rem;
            border: 2px solid #e8d5c4;
            border-radius: 50px;
            background: white;
            font-family: 'Poppins', sans-serif;
            font-size: 0.95rem;
            font-weight: 500;
            color: #8a7066;
            cursor: pointer;
            transition: all 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
            position: relative;
            overflow: hidden;
        }

        .filter-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, #f4a8c0, #d8a8e8);
            transition: left 0.35s ease;
            z-index: -1;
        }

        .filter-btn:hover {
            border-color: #f4a8c0;
            color: white;
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(244, 168, 192, 0.3);
        }

        .filter-btn:hover::before {
            left: 0;
        }

        .filter-btn.active {
            background: linear-gradient(135deg, #f4a8c0, #d8a8e8);
            border-color: #d8a8e8;
            color: white;
            box-shadow: 0 6px 20px rgba(244, 168, 192, 0.3);
        }

        /* ============ RECIPE GRID ============ */
        .recipes-container {
            max-width: 1200px;
            margin: 3rem auto;
            padding: 0 1.5rem;
        }

        .recipe-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 2rem;
            animation: fadeIn 0.6s ease-out;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .recipe-card {
            background: white;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.08);
            transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
            cursor: pointer;
            border: 1px solid rgba(244, 168, 192, 0.1);
            position: relative;
            animation: cardStagger 0.6s ease-out both;
        }

        @keyframes cardStagger {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .recipe-card:nth-child(1) { animation-delay: 0.05s; }
        .recipe-card:nth-child(2) { animation-delay: 0.1s; }
        .recipe-card:nth-child(3) { animation-delay: 0.15s; }
        .recipe-card:nth-child(4) { animation-delay: 0.2s; }
        .recipe-card:nth-child(n+5) { animation-delay: 0.25s; }

        .recipe-card:hover {
            transform: translateY(-12px);
            box-shadow: 0 20px 60px rgba(244, 168, 192, 0.25);
            border-color: #f4a8c0;
        }

        .card-image-wrapper {
            position: relative;
            width: 100%;
            height: 220px;
            overflow: hidden;
            background: linear-gradient(135deg, #f8e5f3, #e5f0f8);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .card-image-wrapper::after {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, rgba(244, 168, 192, 0.1) 0%, transparent 100%);
        }

        .card-image {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .card-emoji {
            font-size: 5rem;
            line-height: 1;
            animation: emojiFloat 3s ease-in-out infinite;
        }

        @keyframes emojiFloat {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }

        .card-body {
            padding: 1.8rem;
        }

        .card-category {
            display: inline-block;
            padding: 0.35rem 1rem;
            background: linear-gradient(135deg, #f8e5f3, #e5f0f8);
            color: #8a5c7a;
            border-radius: 50px;
            font-size: 0.8rem;
            font-weight: 600;
            margin-bottom: 1rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .card-title {
            font-family: 'Playfair Display', serif;
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 0.6rem;
            color: #3d2c2c;
            line-height: 1.3;
        }

        .card-desc {
            font-size: 0.95rem;
            color: #8a7066;
            margin-bottom: 1.2rem;
            line-height: 1.6;
        }

        .card-meta {
            display: flex;
            gap: 1.2rem;
            font-size: 0.88rem;
            color: #a08979;
            flex-wrap: wrap;
        }

        .card-meta span {
            display: flex;
            align-items: center;
            gap: 0.4rem;
            font-weight: 500;
        }

        /* ============ MODAL ============ */
        .modal-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(5px);
            z-index: 1000;
            align-items: center;
            justify-content: center;
            padding: 1rem;
            animation: fadeInOverlay 0.3s ease;
        }

        @keyframes fadeInOverlay {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .modal-overlay.open {
            display: flex;
        }

        .modal {
            background: white;
            border-radius: 24px;
            max-width: 700px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
            position: relative;
            animation: slideUp 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
            box-shadow: 0 25px 70px rgba(0, 0, 0, 0.2);
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(50px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .modal-close {
            position: absolute;
            top: 1.5rem;
            left: 1.5rem;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            border: none;
            background: rgba(255, 255, 255, 0.95);
            font-size: 1.3rem;
            cursor: pointer;
            z-index: 10;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.15);
            transition: all 0.3s ease;
        }

        .modal-close:hover {
            background: white;
            transform: rotate(90deg);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.2);
        }

        .modal-image-wrapper {
            position: relative;
            width: 100%;
            height: 300px;
            overflow: hidden;
            background: linear-gradient(135deg, #f8e5f3, #e5f0f8);
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 24px 24px 0 0;
        }

        .modal-image-wrapper::after {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, rgba(244, 168, 192, 0.1) 0%, transparent 100%);
        }

        .modal-image {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .modal-emoji {
            font-size: 6.5rem;
            line-height: 1;
        }

        .modal-body {
            padding: 2.5rem 2.5rem 3rem;
        }

        .modal-body h2 {
            font-family: 'Playfair Display', serif;
            font-size: 2.2rem;
            font-weight: 800;
            margin-bottom: 0.6rem;
            color: #2d2222;
            line-height: 1.2;
        }

        .modal-desc {
            color: #8a7066;
            margin-bottom: 1.8rem;
            font-size: 1.05rem;
            line-height: 1.7;
        }

        .modal-info {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 1rem;
            margin-bottom: 2rem;
        }

        .info-item {
            background: linear-gradient(135deg, #f8e5f3, #e5f0f8);
            padding: 1.2rem;
            border-radius: 16px;
            text-align: center;
            border: 1px solid rgba(244, 168, 192, 0.15);
        }

        .info-label {
            font-size: 0.8rem;
            color: #a08979;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            font-weight: 600;
            display: block;
            margin-bottom: 0.5rem;
        }

        .info-value {
            font-weight: 700;
            font-size: 1.2rem;
            color: #3d2c2c;
            font-family: 'Playfair Display', serif;
        }

        .modal-body h3 {
            font-family: 'Playfair Display', serif;
            font-size: 1.35rem;
            margin: 1.8rem 0 1rem;
            color: #f4a8c0;
            font-weight: 700;
        }

        .modal-body ul {
            padding-right: 1.5rem;
            margin-bottom: 1.5rem;
        }

        .modal-body li {
            margin-bottom: 0.6rem;
            color: #5a4440;
            line-height: 1.7;
        }

        .modal-body ol {
            padding-right: 1.5rem;
            margin-bottom: 1.5rem;
            counter-reset: ol-counter;
            list-style: none;
        }

        .modal-body ol li {
            counter-increment: ol-counter;
            position: relative;
            margin-bottom: 0.9rem;
            color: #5a4440;
            line-height: 1.7;
            padding-right: 2rem;
        }

        .modal-body ol li::before {
            content: counter(ol-counter);
            position: absolute;
            right: 0;
            width: 28px;
            height: 28px;
            background: linear-gradient(135deg, #f4a8c0, #d8a8e8);
            color: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 0.85rem;
        }

        .modal-body .notes {
            background: linear-gradient(135deg, #f8e5f3, #f0e8f8);
            border-right: 4px solid #f4a8c0;
            padding: 1.2rem 1.5rem;
            border-radius: 12px;
            margin-top: 1.5rem;
            font-size: 0.95rem;
            color: #7a5c6f;
            line-height: 1.7;
        }

        .modal-body .notes strong {
            color: #f4a8c0;
            font-weight: 600;
        }

        /* ============ NO RESULTS ============ */
        .no-results {
            text-align: center;
            padding: 4rem 1rem;
            color: #b8a89a;
            font-size: 1.3rem;
        }

        /* ============ FOOTER ============ */
        footer {
            text-align: center;
            padding: 3rem 1rem;
            color: #b8a89a;
            font-size: 0.95rem;
            background: linear-gradient(180deg, transparent 0%, rgba(244, 168, 192, 0.05) 100%);
            border-top: 1px solid rgba(244, 168, 192, 0.1);
        }

        footer .heart {
            color: #f4a8c0;
            animation: heartbeat 1.5s ease-in-out infinite;
        }

        @keyframes heartbeat {
            0%, 100% { transform: scale(1); }
            25% { transform: scale(1.2); }
            50% { transform: scale(1); }
        }

        /* ============ RESPONSIVE ============ */
        @media (max-width: 768px) {
            header {
                padding: 3rem 1.5rem 2rem;
            }

            header h1 {
                font-size: 2.2rem;
            }

            .recipe-grid {
                grid-template-columns: 1fr;
                gap: 1.5rem;
            }

            .modal-info {
                grid-template-columns: 1fr;
            }

            .modal-body {
                padding: 2rem 1.5rem 2.5rem;
            }

            .modal-body h2 {
                font-size: 1.8rem;
            }
        }

        /* Scrollbar styling */
        .modal::-webkit-scrollbar {
            width: 8px;
        }

        .modal::-webkit-scrollbar-track {
            background: transparent;
        }

        .modal::-webkit-scrollbar-thumb {
            background: linear-gradient(180deg, #f4a8c0, #d8a8e8);
            border-radius: 4px;
        }

        .modal::-webkit-scrollbar-thumb:hover {
            background: linear-gradient(180deg, #d8a8e8, #a8d4f0);
        }
    </style>
</head>
<body>

<header>
    <div class="header-content">
        <div class="header-avatar">👩‍🍳</div>
        <h1>המתכונים של תמר</h1>
        <p>אוסף מתכונים ביתיים מיוחדים עם אהבה וטוב-טעם</p>
    </div>
</header>

<div class="controls-wrapper">
    <div class="controls-container">
        <div class="search-container">

        </div>
        <nav class="filter-bar" id="filterBar">

            <button class="filter-btn" data-cat="סלטים">סלטים</button>
            <button class="filter-btn" data-cat="מרקים">מרקים</button>
            <button class="filter-btn" data-cat="קינוחים">קינוחים</button>
            <button class="filter-btn" data-cat="אפייה">אפייה</button>
            <button class="filter-btn" data-cat="תוספות">תוספות</button>
        </nav>
    </div>
</div>

<main class="recipes-container">
    <div class="recipe-grid" id="recipeGrid"></div>
    <div class="no-results" id="noResults" style="display:none;">😕 לא נמצאו מתכונים</div>
</main>

<div class="modal-overlay" id="modalOverlay">
    <div class="modal" id="modal">
        <button class="modal-close" id="modalClose">✕</button>
        <div id="modalContent"></div>
    </div>
</div>

<footer>
    <p>עשוי בחמימות ובאהבה <span class="heart">❤️</span> עבור תמר</p>
</footer>

            "כשהשוקולד והחמאה נמסים לחלוטין יוצקים את התערובת על הפופוקורן.",
            "מערבבים את הפופוקורן היטב כדי שהציפוי יתפזר שווה.",
            "מפזרים את הפופוקורן בתבנית המרופדת בנייר אפייה.",
            "אופים בתנור החם (120 מעלות) כ-25 דקות כדי לייבש את הפופוקורן ולהחזיר לו את הפריכות.",
            "מצננים היטב.",
            "שומרים בקופסה אטומה מחוץ למקרר עד שבוע."
        ],
        notes: "הסוד לפופוקורן טעים הוא הייבוש בתנור — זה מחזיר את הפריכות! אם תרגישו שהוא רך יותר מדי אחרי הציפוי, הנתו בתנור עוד חמש דקות."
    }
];

const grid = document.getElementById('recipeGrid');
const noResults = document.getElementById('noResults');
let currentFilter = 'הכל';

function renderCards(list) {
    grid.innerHTML = '';
    if (list.length === 0) {
        noResults.style.display = 'block';
        return;
    }
    noResults.style.display = 'none';
    list.forEach(r => {
        const card = document.createElement('div');
        card.className = 'recipe-card';
        card.onclick = () => openModal(r);
        card.innerHTML = `
            <div class="card-image-wrapper">
                ${r.image ? `<img class="card-image" src="${r.image}" alt="${r.title}">` : `<div class="card-emoji">${r.emoji}</div>`}
            </div>
            <div class="card-body">
                <span class="card-category">${r.category}</span>
                <h3 class="card-title">${r.title}</h3>
                <p class="card-desc">${r.desc}</p>
                <div class="card-meta">
                    <span>⏱ ${r.time}</span>
                    <span>🍽 ${r.servings}</span>
                    <span>✨ ${r.difficulty}</span>
                </div>
            </div>
        `;
        grid.appendChild(card);
    });
}

function filterAndSearch() {
    const q = document.getElementById('searchInput').value.trim().toLowerCase();
    let filtered = recipes;
    if (currentFilter !== 'הכל') {
        filtered = filtered.filter(r => r.category === currentFilter);
    }
    if (q) {
        filtered = filtered.filter(r =>
            r.title.includes(q) || r.desc.includes(q) ||
            r.ingredients.some(i => i.includes(q)) ||
            r.category.includes(q)
        );
    }
    renderCards(filtered);
}

document.getElementById('filterBar').addEventListener('click', e => {
    if (!e.target.classList.contains('filter-btn')) return;
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    e.target.classList.add('active');
    currentFilter = e.target.dataset.cat;
    filterAndSearch();
});

document.getElementById('searchInput').addEventListener('input', filterAndSearch);

function openModal(r) {
    const overlay = document.getElementById('modalOverlay');
    const content = document.getElementById('modalContent');
    content.innerHTML = `
        <div class="modal-image-wrapper">
            ${r.image ? `<img class="modal-image" src="${r.image}" alt="${r.title}">` : `<div class="modal-emoji">${r.emoji}</div>`}
        </div>
        <div class="modal-body">
            <h2>${r.title}</h2>
            <p class="modal-desc">${r.desc}</p>
            <div class="modal-info">
                <div class="info-item"><span class="info-label">⏱ זמן</span><span class="info-value">${r.time}</span></div>
                <div class="info-item"><span class="info-label">🍽 מנות</span><span class="info-value">${r.servings}</span></div>
                <div class="info-item"><span class="info-label">✨ קושי</span><span class="info-value">${r.difficulty}</span></div>
            </div>
            <h3>📋 מצרכים</h3>
            <ul>${r.ingredients.map(i => `<li>${i}</li>`).join('')}</ul>
            <h3>👨‍🍳 אופן ההכנה</h3>
            <ol>${r.steps.map(s => `<li>${s}</li>`).join('')}</ol>
            ${r.notes ? `<div class="notes">💡 <strong>טיפ:</strong> ${r.notes}</div>` : ''}
        </div>
    `;
    overlay.classList.add('open');
    document.body.style.overflow = 'hidden';
}

document.getElementById('modalClose').onclick = closeModal;
document.getElementById('modalOverlay').onclick = e => { if (e.target === e.currentTarget) closeModal(); };
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });

function closeModal() {
    document.getElementById('modalOverlay').classList.remove('open');
    document.body.style.overflow = '';
}

renderCards(recipes);
</script>
</body>
</html>
