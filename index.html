<html lang="he" dir="rtl">

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Heebo', sans-serif;
            background: linear-gradient(135deg, #faf7f2 0%, #f8e5f3 50%, #e5f0f8 100%);
            color: #3d2c2c;
            line-height: 1.7;
        }

        /* Header */
        header {
            background: linear-gradient(135deg, #f4a8c0 0%, #d8a8f0 50%, #a8d4f8 100%);
            color: white;
            text-align: center;
            padding: 3rem 1rem 2.5rem;
            position: relative;
            overflow: hidden;
        }
        header::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(255,255,255,0.1) 0%, transparent 60%);
            animation: shimmer 8s ease-in-out infinite;
        }
        @keyframes shimmer {
            0%, 100% { transform: translate(0, 0); }
            50% { transform: translate(5%, 5%); }
        }
        header h1 {
            font-family: 'Secular One', sans-serif;
            font-size: 2.8rem;
            position: relative;
            text-shadow: 0 2px 10px rgba(0,0,0,0.15);
        }
        header p {
            font-size: 1.15rem;
            margin-top: 0.5rem;
            opacity: 0.92;
            position: relative;
            font-weight: 300;
        }

        /* Navigation / Filter */
        .filter-bar {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 0.5rem;
            padding: 1.2rem 1rem;
            background: white;
            box-shadow: 0 2px 12px rgba(0,0,0,0.06);
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .filter-btn {
            padding: 0.5rem 1.2rem;
            border: 2px solid #e8d5c4;
            border-radius: 50px;
            background: transparent;
            font-family: 'Heebo', sans-serif;
            font-size: 0.95rem;
            font-weight: 500;
            color: #7a5c4f;
            cursor: pointer;
            transition: all 0.25s;
        }
        .filter-btn:hover, .filter-btn.active {
            background: linear-gradient(135deg, #f4a8c0, #d8a8f0);
            border-color: #d8a8f0;
            color: white;
        }

        /* Search */
        .search-container {
            max-width: 500px;
            margin: 1.5rem auto 0;
            padding: 0 1rem;
        }
        .search-box {
            width: 100%;
            padding: 0.75rem 1.2rem;
            border: 2px solid #e8d5c4;
            border-radius: 50px;
            font-family: 'Heebo', sans-serif;
            font-size: 1rem;
            background: white;
            outline: none;
            transition: border-color 0.25s;
        }
        .search-box:focus {
            border-color: #e76f51;
        }
        .search-box::placeholder {
            color: #bda89a;
        }

        /* Recipe Grid */
        .recipes-container {
            max-width: 1100px;
            margin: 2rem auto;
            padding: 0 1.2rem;
        }
        .recipe-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 1.5rem;
        }

        .recipe-card {
            background: white;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 4px 20px rgba(0,0,0,0.06);
            transition: transform 0.3s, box-shadow 0.3s;
            cursor: pointer;
        }
        .recipe-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 8px 30px rgba(0,0,0,0.12);
        }
        .card-image {
            width: 100%;
            height: 200px;
            object-fit: cover;
            display: block;
        }
        .card-placeholder {
            width: 100%;
            height: 200px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 4rem;
            background: linear-gradient(135deg, #f8e5f3, #e5f0f8);
            position: relative;
            overflow: hidden;
        }
        .card-placeholder::before {
            content: '';
            position: absolute;
            width: 60px;
            height: 60px;
            background: radial-gradient(circle, rgba(255,200,200,0.3) 0%, transparent 70%);
            top: 20%;
            left: 10%;
            border-radius: 50%;
        }
        .card-placeholder::after {
            content: '';
            position: absolute;
            width: 40px;
            height: 40px;
            background: radial-gradient(circle, rgba(200,200,255,0.2) 0%, transparent 70%);
            bottom: 15%;
            right: 15%;
            border-radius: 50%;
        }
        .card-body {
            padding: 1.2rem;
        }
        .card-category {
            display: inline-block;
            padding: 0.2rem 0.7rem;
            background: linear-gradient(135deg, #f8c5d6, #d8c5f8);
            color: #8a5c7a;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 500;
            margin-bottom: 0.5rem;
        }
        .card-title {
            font-family: 'Secular One', sans-serif;
            font-size: 1.3rem;
            margin-bottom: 0.4rem;
            color: #3d2c2c;
        }
        .card-desc {
            font-size: 0.92rem;
            color: #8a7066;
            margin-bottom: 0.8rem;
        }
        .card-meta {
            display: flex;
            gap: 1rem;
            font-size: 0.85rem;
            color: #a08979;
        }
        .card-meta span { display: flex; align-items: center; gap: 0.3rem; }
        
        /* Decorative icons */
        .icon-mini {
            width: 18px;
            height: 18px;
            display: inline-block;
        }
        .cooking-glyph {
            display: inline-block;
            font-size: 1.1rem;
            margin-right: 0.2rem;
        }

        .modal-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.5);
            z-index: 1000;
            align-items: center;
            justify-content: center;
            padding: 1rem;

        .modal-overlay.open { display: flex; }
        .modal {
            background: white;
            border-radius: 20px;
            max-width: 650px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
            position: relative;
            animation: slideUp 0.3s ease;

            top: 1rem;
            left: 1rem;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            border: none;
            background: rgba(255,255,255,0.9);
            font-size: 1.2rem;
            cursor: pointer;
            z-index: 10;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 2px 8px rgba(0,0,0,0.15);

            height: 260px;

            border-radius: 20px 20px 0 0;
        }

            height: 260px;

            justify-content: center;

            left: 5%;

            width: 80px;
            height: 80px;
            background: radial-gradient(circle, rgba(200,200,255,0.2) 0%, transparent 70%);
            bottom: 10%;
            right: 10%;
            border-radius: 50%;

        .modal-body {
            padding: 1.5rem 2rem 2rem;

        .modal-body h2 {

            font-size: 1.8rem;
            margin-bottom: 0.3rem;
        }
        .modal-body .modal-desc {

        .modal-info {

            align-items: center;
            padding: 0.6rem 1rem;
            background: linear-gradient(135deg, #f8e5f3, #e5f0f8);
            border-radius: 12px;
            min-width: 80px;
        }
        .info-item .info-label {
            font-size: 0.75rem;
            color: #a08979;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }
        .info-item .info-value {

            font-size: 1.05rem;
            color: #3d2c2c;
        }
        .modal-body h3 {

        }
        .modal-body ul {
            padding-right: 1.2rem;
        }
        .modal-body li {

            color: #5a4440;
        }
        .modal-body ol {

        @media (max-width: 600px) {

            .recipe-grid { grid-template-columns: 1fr; }

        }
    </style>
</head>

// ============ Rendering ============
const grid = document.getElementById('recipeGrid');
const noResults = document.getElementById('noResults');
let currentFilter = 'הכל';

function renderCards(list) {
    grid.innerHTML = '';
    if (list.length === 0) {
        noResults.style.display = 'block';
        return;
    }
    noResults.style.display = 'none';
    list.forEach(r => {
        const card = document.createElement('div');
        card.className = 'recipe-card';
        card.onclick = () => openModal(r);
        card.innerHTML = `
            ${r.image ? `<img class="card-image" src="${r.image}" alt="${r.title}">` : `<div class="card-placeholder">${r.emoji}</div>`}
            <div class="card-body">
                <span class="card-category">${r.category}</span>
                <h3 class="card-title">${r.title}</h3>
                <p class="card-desc">${r.desc}</p>
                <div class="card-meta">
                    <span><span class="cooking-glyph">⏱</span>${r.time}</span>
                    <span><span class="cooking-glyph">🍽</span>${r.servings} מנות</span>
                    <span><span class="cooking-glyph">✨</span>${r.difficulty}</span>
                </div>
            </div>
        `;
        grid.appendChild(card);
    });
}

function filterAndSearch() {
    const q = document.getElementById('searchInput').value.trim().toLowerCase();
    let filtered = recipes;
    if (currentFilter !== 'הכל') {
        filtered = filtered.filter(r => r.category === currentFilter);
    }
    if (q) {
        filtered = filtered.filter(r =>
            r.title.includes(q) || r.desc.includes(q) ||
            r.ingredients.some(i => i.includes(q)) ||
            r.category.includes(q)
        );
    }
    renderCards(filtered);
}

// Filter buttons
document.getElementById('filterBar').addEventListener('click', e => {
    if (!e.target.classList.contains('filter-btn')) return;
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    e.target.classList.add('active');
    currentFilter = e.target.dataset.cat;
    filterAndSearch();
});

// Search
document.getElementById('searchInput').addEventListener('input', filterAndSearch);

// Modal
function openModal(r) {
    const overlay = document.getElementById('modalOverlay');
    const content = document.getElementById('modalContent');
    content.innerHTML = `
        ${r.image ? `<img class="modal-image" src="${r.image}" alt="${r.title}">` : `<div class="modal-placeholder">${r.emoji}</div>`}
        <div class="modal-body">
            <h2>${r.title}</h2>
            <p class="modal-desc">${r.desc}</p>
            <div class="modal-info">
                <div class="info-item"><span class="cooking-glyph">⏱</span><span class="info-label">זמן</span><span class="info-value">${r.time}</span></div>
                <div class="info-item"><span class="cooking-glyph">🍽</span><span class="info-label">מנות</span><span class="info-value">${r.servings}</span></div>
                <div class="info-item"><span class="cooking-glyph">✨</span><span class="info-label">קושי</span><span class="info-value">${r.difficulty}</span></div>
            </div>
            <h3>מצרכים</h3>
            <ul>${r.ingredients.map(i => `<li>${i}</li>`).join('')}</ul>
            <h3>אופן ההכנה</h3>
            <ol>${r.steps.map(s => `<li>${s}</li>`).join('')}</ol>
            ${r.notes ? `<div class="notes">💡 <strong>טיפ:</strong> ${r.notes}</div>` : ''}
        </div>
    `;
    overlay.classList.add('open');
    document.body.style.overflow = 'hidden';
}

document.getElementById('modalClose').onclick = closeModal;
document.getElementById('modalOverlay').onclick = e => { if (e.target === e.currentTarget) closeModal(); };
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });
function closeModal() {
    document.getElementById('modalOverlay').classList.remove('open');
    document.body.style.overflow = '';
}

// Initial render
renderCards(recipes);
</script>
